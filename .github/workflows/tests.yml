name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # opencv-python's Windows wheels are self-contained; on Linux they also need libGL.
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v --cov=libraries --cov=frametime_analyser --cov-report=term-missing
